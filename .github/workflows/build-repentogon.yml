
name: Build High FPS for REPENTOGON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout REPENTOGON support source
        uses: actions/checkout@v4
        with:
          repository: hunchcldev/isaac-highfps
          ref: repentogon-support

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build 32-bit Windows DLL
        shell: cmd
        run: call build.bat

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: isaac-highfps-repentogon
          path: |
            build/winmm.dll
            build/alt/dbghelp.dll
          if-no-files-found: error
