
name: Build High FPS for REPENTOGON

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout REPENTOGON support
        uses: actions/checkout@v4
        with:
          repository: hunchcldev/isaac-highfps
          ref: repentogon-support

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose early initialization
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/dllmain.cpp")
          s = p.read_text(encoding="utf-8")

          old = "GetModuleFileNameA(nullptr, host, MAX_PATH);"
          new = 'Log("[diagnostic] before GetModuleFileNameA"); GetModuleFileNameA(nullptr, host, MAX_PATH); Log("[diagnostic] after GetModuleFileNameA");'

          assert s.count(old) == 1, "Expected source line not found"
          p.write_text(s.replace(old, new), encoding="utf-8")

      - name: Build 32-bit DLL
        shell: cmd
        run: call build.bat

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: isaac-highfps-repentogon-diagnostic
          path: build/winmm.dll
          if-no-files-found: error
